[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwarp"
version = "0.1.0"
description = "A lightweight terminal interface with an optional agent connection."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openwarp = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["cli*"]
